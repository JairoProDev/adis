version: '3.8'

services:
  # PostgreSQL Database with extensions
  postgres:
    image: pgvector/pgvector:pg16
    container_name: publicadis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: publicadis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - publicadis-network

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: publicadis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - publicadis-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  publicadis-network:
    driver: bridge

